# 2026-09-12 (rev 2): /v1/search was returning 503 `search_degraded` on every
# query. Root cause: SearXNG's default engine roster (Google, Bing, Startpage,
# Yahoo…) hard-blocks this deployment's datacenter IP, so every engine came
# back unresponsive and crw mapped the empty pool to SearchDegraded.
#
# Fix: keep ONLY a curated set of keyless, independent-index engines that
# tolerate datacenter source IPs. NOTE (rev 2): in SearXNG 2026.5.9 the
# `use_default_settings.engines` key must be a dict with `keep_only:`/`remove:`
# lists — the older boolean `engines: false` form crashes the worker with
# AttributeError ('bool' object has no attribute 'get') in settings_loader.
#
# Escalation ladder if these engines also start blocking: (1) API keys —
# Brave/Mojeek/Marginalia offer them (commented below); (2) an
# `outgoing.proxies` residential proxy, which re-unlocks Google/Bing too.

use_default_settings:
  # Filters the DEFAULT engine roster to exactly these names — their upstream
  # definitions (categories, network, timeouts) are kept as-is. The `engines:`
  # section further below then merges overrides by name (re-enabling the ones
  # upstream ships disabled).
  engines:
    keep_only:
      - brave          # keyless scrape of search.brave.com; independent index
      - duckduckgo     # keyless; usually tolerates datacenter IPs
      - mojeek         # own crawler + index; lenient with VPS IPs
      - qwant          # independent European index
      - marginalia     # independent non-commercial index (long-tail strength)
      - mwmbl          # free open API, small crowdfunded index
      - wikipedia      # API-backed, never IP-blocks

general:
  instance_name: "crw-search"
  privacypolicy_url: false
  contact_url: false
  donation_url: false

search:
  safe_search: 0
  autocomplete: ""
  default_lang: "auto"
  # JSON format must be explicitly enabled — SearXNG returns 403 on
  # `?format=json` otherwise. The `html` entry is kept so the upstream
  # /search UI remains usable for debugging.
  formats:
    - html
    - json

server:
  # Required by SearXNG. The SEARXNG_SECRET_KEY env var on the container will
  # override this at startup via the upstream image's templating; the literal
  # below is only a fallback that lets the container boot in dev without env.
  # In production, generate one with `openssl rand -hex 32` and set it in `.env`.
  secret_key: "change-me-with-openssl-rand-hex-32-please"
  bind_address: "0.0.0.0"
  port: 8080
  # Rate limiting is handled by crw-server's own middleware, so SearXNG's
  # built-in limiter (which would require Valkey/Redis) stays off. This
  # also lets us drop the Valkey container — one less moving part.
  limiter: false
  public_instance: false
  image_proxy: false
  method: "GET"

engines:
  # keep_only above loads the upstream definitions; these entries MERGE by
  # name (settings_loader.update_dict) and only change what upstream ships
  # wrong for this deployment: re-enable the engines upstream defaults to
  # off, and let wikipedia hits reach the results list.
  - name: mojeek
    disabled: false
    # api_key: ""  # https://www.mojeek.com/services/api/web_search/ (raises limits)
  - name: qwant
    disabled: false
  - name: marginalia
    disabled: false
    inactive: false
    # api_key: ""  # https://about.marginalia-search.com/article/api/ (raises volume)
  - name: mwmbl
    disabled: false
  - name: wikipedia
    # Upstream default is infobox-only; "list" makes hits land in the JSON
    # results array crw consumes.
    display_type: ["infobox", "list"]
  # brave + duckduckgo are enabled by default upstream — no override needed.
